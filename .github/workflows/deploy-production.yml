name: Deploy Production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Check deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret before deploying."
              exit 1
            fi
          done
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: npm test
      - name: Install Vercel CLI
        run: npm install --global vercel@54.14.5
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and deploy Convex
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
